plugins { id 'com.android.application' }
def ksProps = new Properties()
def ksFile = new File('/workspace/espacioinfinito/keys/keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
android {
    namespace 'com.ikeriano.espacioinfinito'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ikeriano.espacioinfinito'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile new File('/workspace/espacioinfinito/keys/' + ksProps['storeFile'])
                storePassword ksProps['storePassword']; keyAlias ksProps['keyAlias']; keyPassword ksProps['keyPassword']
                enableV1Signing true; enableV2Signing true; enableV3Signing true
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    testOptions { unitTests { includeAndroidResources = true; all { maxHeapSize = '2g' } } }
    lint { abortOnError false; checkReleaseBuilds false }
}
dependencies {
    implementation files('libs/tdlib-classes.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
